name: Assistente
options:
  bundleIdPrefix: com.caiogobbi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Assistente:
    type: application
    platform: iOS
    sources: [Assistente]
    scheme: {}
    info:
      path: Assistente/Info.plist
      properties:
        CFBundleDisplayName: 灯火
        # A Siri em português não lê kanji: "Tomoshibi" é o nome falado.
        INAlternativeAppNames:
          - INAlternativeAppName: Tomoshibi
            INAlternativeAppNamePronunciationHint: tomochíbi
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        NSMicrophoneUsageDescription: Para você mandar áudio pro Tomoshibi na conversa.
        NSSpeechRecognitionUsageDescription: Para transformar seu áudio em texto antes de mandar pro Tomoshibi.
        BGTaskSchedulerPermittedIdentifiers: [com.caiogobbi.assistente.briefing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caiogobbi.assistente
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Preencha com o Team ID da sua conta Apple (grátis serve) ou escolha no Xcode.
        DEVELOPMENT_TEAM: ""
