name: Assistente
options:
  bundleIdPrefix: com.caiogobbi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Assistente:
    type: application
    platform: iOS
    sources: [Assistente]
    scheme: {}
    info:
      path: Assistente/Info.plist
      properties:
        CFBundleDisplayName: Assistente
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caiogobbi.assistente
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Preencha com o Team ID da sua conta Apple (grátis serve) ou escolha no Xcode.
        DEVELOPMENT_TEAM: ""
