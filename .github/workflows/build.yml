name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar e compilar
        run: scripts/gerar-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Assistente-ipa
          path: Assistente.ipa
          retention-days: 30
